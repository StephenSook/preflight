name: keepalive
# Render's free tier sleeps after 15 idle minutes and wakes in 30 to 60 s, longer than the answer
# webhook budget Vonage allows. This pings the health check on offset minutes (GitHub deprioritises
# :00 and */N schedules). A cron is never a liveness guarantee: deadman.yml is the net that alerts
# when these pings stop, and daily-call.yml is the job that proves the real path.
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: health must answer with the database attached
        run: |
          set -euo pipefail
          test -n "${{ vars.PREFLIGHT_API_URL }}" || { echo "PREFLIGHT_API_URL repository variable is not set"; exit 1; }
          body=$(curl -fsS --max-time 75 "${{ vars.PREFLIGHT_API_URL }}/health")
          echo "$body"
          echo "$body" | grep -q '"ok":true' || { echo "health did not report ok"; exit 1; }
          echo "$body" | grep -q '"store":"postgres"' || { echo "health is not on the postgres store"; exit 1; }
