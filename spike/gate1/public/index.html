<!doctype html>
<meta charset="utf-8">
<title>Gate 1 spike leg</title>
<style>
 body{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;margin:16px;background:#101215;color:#d8dee9}
 button{font:inherit;padding:6px 12px;margin-right:6px;background:#2b3138;color:#d8dee9;border:1px solid #4a525c;border-radius:4px;cursor:pointer}
 button:disabled{opacity:.4;cursor:default}
 #log{white-space:pre-wrap;background:#0a0c0e;border:1px solid #2b3138;padding:8px;height:44vh;overflow:auto;margin-top:10px}
 .k{color:#8fbcbb} .bad{color:#bf616a} .ok{color:#a3be8c}
 #meter{height:14px;background:#0a0c0e;border:1px solid #2b3138;margin-top:8px}
 #bar{height:100%;width:0;background:#a3be8c}
</style>
<h3>GATE 1 SPIKE — conversation leg</h3>
<div>
  role
  <select id="role">
    <option value="source">source (1000 Hz tone)</option>
    <option value="listenerA">listenerA</option>
    <option value="listenerB">listenerB</option>
  </select>
  <button id="go">connect</button>
  <button id="up" disabled>upload samples</button>
  <button id="stop" disabled>hang up</button>
</div>
<div id="meter"><div id="bar"></div></div>
<div id="log">idle</div>
<script src="https://cdn.jsdelivr.net/npm/@vonage/client-sdk@2.7.0/dist/vonageClientSDK.js"></script>
<script src="./leg.js"></script>
